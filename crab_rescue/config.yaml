# Crab Rescue configuration. No secrets here: the API key and base URL come from the
# environment (NEBIUS_API_KEY, NEBIUS_BASE_URL), never from this file.

sim:
  cell_m: 0.5              # one grid cell = 0.5 m
  grid: [20, 16]           # cells (x, y) -> 10 m x 8 m room
  dt: 0.1                  # control step, s
  max_episode_s: 120.0
  robot_radius_m: 0.2
  grasp_radius_m: 0.4      # weld-on-contact distance (simplified "carry")
  carry_offset_m: 0.3
  fire:
    p_spread: 0.06         # per burning 4-neighbour, per fire step
    step_s: 1.0
    figurine_burn_s: 4.0   # figurine is lost after this long in a burning cell

limits:
  cmd_max: [0.8, 0.8, 4.0] # vx, vy, yaw rate: the locomotion policy's command ranges
  plan_speed_max: 0.6      # m/s the planner may ask for
  max_waypoints: 16
  wall_margin_m: 0.2
  fire_margin_m: 0.15

agent:
  vlm_period_s: 6.0
  replan_period_s: 8.0
  fire_spread_event_cells: 3
  low_confidence: 0.5

caps:                      # hard caps; on cap new calls stop and the last valid plan is kept
  max_total_usd: 1.0       # TODO(user): set below your Token Factory credit
  max_tokens_per_call: 2000
  max_vlm_calls_per_episode: 20
  max_replans_per_episode: 12
  max_escalations: 2
  max_repairs: 2

# Model ids come ONLY from the endpoint's /v1/models; prices (USD per 1M tokens) only from
# the console. null = not yet known: real (non-fake) calls refuse to run until filled in.
models:
  vlm_primary:         {id: null, price_in: null, price_out: null}   # Cosmos3-Super-Reasoner (candidate)
  vlm_cheap:           {id: null, price_in: null, price_out: null}   # Nemotron-Nano-V2-12b (candidate)
  planner:             {id: null, price_in: null, price_out: null}   # Nemotron-3-Super (candidate)
  planner_fast:        {id: null, price_in: null, price_out: null}   # Nemotron-3.5-Lightning (candidate)
  planner_escalation:  {id: null, price_in: null, price_out: null}   # Nemotron-3-Ultra (candidate)

# Rough token assumptions used by --dry-run only.
estimates:
  vlm_in: 1500
  vlm_out: 300
  planner_in: 1200
  planner_out: 400
